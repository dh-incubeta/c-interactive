html,body{margin:0;height:100%}

input:focus{border-color:var(--purple)}

button:disabled{opacity:.6;cursor:wait}
.err{color:var(--coral);font-size:13px;font-weight:600;min-height:20px;margin-top:10px}
noscript{display:block;margin-top:12px;font-size:13px;color:var(--coral)}

<script>
(function(){
  var P = JSON.parse(document.getElementById("payload").textContent);
  function u8(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
  var f=document.getElementById("f"),pw=document.getElementById("pw"),go=document.getElementById("go"),err=document.getElementById("err");
  if(!window.crypto||!crypto.subtle){err.textContent="This browser can't open the page. Try a current version of Chrome, Edge, Safari or Firefox.";go.disabled=true;return;}
  f.addEventListener("submit",async function(e){
    e.preventDefault(); err.textContent=""; go.disabled=true; go.textContent="Opening…";
    try{
      var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw.value),"PBKDF2",false,["deriveKey"]);
      var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(P.s),iterations:P.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
      var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(P.i)},key,u8(P.c));
      var html=new TextDecoder().decode(pt);
      document.open(); document.write(html); document.close();
    }catch(x){
      err.textContent="That password didn't work. Check it and try again.";
      go.disabled=false; go.textContent="Open report"; pw.select();
    }
  });
})();
</script>
