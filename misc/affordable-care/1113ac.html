:root{--ink:#212121;--paper:#F8F8F8;--indigo:#5801F7;--muted:#5E5D66;--line:#E3E1EA}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);color:var(--ink);font-family:Montserrat,Helvetica,Arial,sans-serif;padding:16px;position:relative;overflow:hidden}
.lk-glow{position:fixed;width:620px;height:620px;border-radius:50%;right:-220px;top:-240px;background:radial-gradient(circle at 40% 40%,#7B3BFF 0%,#5801F7 45%,rgba(88,1,247,0) 70%);opacity:.55;pointer-events:none}
.lk-ring{position:fixed;width:420px;height:420px;border-radius:50%;left:-180px;bottom:-200px;border:2px solid rgba(255,255,255,.12);pointer-events:none}
.box{position:relative;width:min(460px,100%);background:var(--paper);border-radius:22px;padding:30px 28px 26px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.lk-logos{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.lk-client{height:52px;width:auto;display:block}
.lk-x{font-size:20px;font-weight:700;color:var(--muted)}
.lk-inc svg{fill:var(--ink)}
.lk-k{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--indigo);margin:0 0 6px}
h1{font-size:22px;line-height:1.25;margin:0 0 8px;font-weight:700}
p{font-size:14px;line-height:1.5;color:var(--muted);margin:0 0 18px}
label{font-size:13px;font-weight:600;display:block;margin-bottom:6px}
input{width:100%;border:1px solid #CFCDD8;background:#fff;color:var(--ink);border-radius:12px;padding:12px 14px;font-size:16px;font-family:inherit}
input:focus{outline:2px solid var(--indigo);outline-offset:1px;border-color:var(--indigo)}
button{margin-top:14px;width:100%;border:0;border-radius:999px;padding:13px;font-size:15px;font-weight:700;background:var(--indigo);color:#fff;cursor:pointer;font-family:inherit}
button:hover{background:#4600C7}
.err{color:#C8361C;font-size:13px;min-height:18px;margin-top:10px}
.lk-foot{font-size:11.5px;color:var(--muted);margin:14px 0 0;border-top:1px solid var(--line);padding-top:12px}
@media (max-width:420px){.box{padding:24px 20px}.lk-client{height:42px}h1{font-size:19px}}
