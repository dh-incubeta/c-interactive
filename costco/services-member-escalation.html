<style>/* ==========================================================================
   Incubeta — unified stylesheet (tokens + base + web components + print doc)
   Source: Incubeta Design System (Claude Design), Visual Guide 2025 v0.01.
   Readability override applied: body >= 11pt / 16px, ink not grey, secondary
   text gray-700. Keep in sync with scripts/brand.py.

   Fonts: local TTFs via ../fonts/. In a published Artifact, replace the
   @font-face block with Google Fonts:
   <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
   ========================================================================== */

/* ---- 1. Fonts ----------------------------------------------------------- */
/* ---- 2. Tokens ---------------------------------------------------------- */
:root {
  --ink: #212121; --paper: #F8F8F8; --true-white: #FFFFFF; --true-black: #000000;
  --gray-25: #FBFBFB; --gray-50: #F8F8F8; --gray-100: #F0F0F0; --gray-200: #E4E4E4; --gray-300: #D2D2D2;
  --gray-400: #ADADAD; --gray-500: #818181; --gray-600: #5C5C5C; --gray-700: #3D3D3D; --gray-800: #2B2B2B; --gray-900: #212121;

  --indigo: #5801F7; --violet: #9901FF; --magenta: #911F90; --coral: #F75131; --orange: #FF9637;
  --indigo-700: #4400C2; --indigo-600: #4E01DD; --indigo-300: #B79AFB; /* fill only, never text */
  --indigo-100: #EADFFE; --coral-100: #FEE7E2; --orange-100: #FFF0E1;
  --night: #15131C; /* deep ground under gradient imagery */

  --gradient-indigo-orange: linear-gradient(120deg, #5801F7 0%, #FF9637 100%);
  --gradient-violet-orange: linear-gradient(120deg, #9901FF 0%, #FF9637 100%);
  --gradient-coral-indigo: linear-gradient(95deg, #F75131 0%, #911F90 48%, #5801F7 100%);
  --gradient-text: linear-gradient(96deg, #5801F7 0%, #9901FF 32%, #F75131 72%, #FF9637 100%);
  --gradient-mesh: radial-gradient(120% 120% at 18% 18%, #9901FF 0%, #5801F7 38%, #911F90 66%, #F75131 86%, #FF9637 100%);

  --text-primary: var(--ink); --text-secondary: var(--gray-700); --text-muted: var(--gray-600);
  --text-on-dark: var(--paper); --text-accent: var(--indigo);
  --surface-page: var(--paper); --surface-card: var(--true-white); --surface-sunken: var(--gray-100);
  --border-subtle: var(--gray-200); --border-default: var(--gray-300);
  --accent: var(--indigo); --accent-hover: var(--indigo-600); --accent-press: var(--indigo-700);

  --font-sans: "Montserrat", "Helvetica Neue", Arial, sans-serif;

  --text-display-xl: clamp(40px, 7vw, 88px); --text-display: clamp(40px, 5.2vw, 64px);
  --text-h1: clamp(32px, 3.6vw, 44px); --text-h2: clamp(26px, 2.6vw, 33px); --text-h3: 24px; --text-h4: 20px;
  --text-eyebrow: 14px; --text-body-lg: 19px; --text-body: 17px; --text-body-sm: 15px; --text-caption: 13px;
  --leading-tight: 0.95; --leading-snug: 1.15; --leading-body: 1.55;
  --tracking-display: -0.01em; --tracking-eyebrow: 0.16em;

  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px;
  --space-8: 32px; --space-10: 40px; --space-12: 48px; --space-16: 64px; --space-20: 80px; --space-24: 96px; --space-32: 128px;
  --radius-xs: 6px; --radius-sm: 10px; --radius-md: 16px; --radius-lg: 24px; --radius-xl: 32px; --radius-pill: 999px;

  --shadow-xs: 0 1px 2px rgba(33,33,33,.06); --shadow-sm: 0 2px 6px rgba(33,33,33,.08);
  --shadow-md: 0 8px 24px rgba(33,33,33,.10); --shadow-lg: 0 18px 48px rgba(33,33,33,.14);
  --shadow-indigo: 0 16px 40px rgba(88,1,247,.32);

  --container: 1200px; --page-margin: clamp(16px, 6vw, 96px);
  --ease-standard: cubic-bezier(.4,0,.2,1); --ease-out: cubic-bezier(.16,1,.3,1);
  --dur-fast: 140ms; --dur-med: 240ms; --dur-slow: 400ms;
}

/* ---- 3. Base ------------------------------------------------------------ */
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; font-family: var(--font-sans); font-size: var(--text-body); line-height: var(--leading-body);
  color: var(--text-primary); background: var(--surface-page); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-family: var(--font-sans); font-weight: 700; line-height: 1.1; letter-spacing: var(--tracking-display);
  color: inherit; margin: 0 0 .45em; text-wrap: balance; }
h1 { font-size: var(--text-h1); } h2 { font-size: var(--text-h2); } h3 { font-size: var(--text-h3); } h4 { font-size: var(--text-h4); }
p { margin: 0 0 1em; text-wrap: pretty; }
a { color: var(--accent); text-decoration: none; } a:hover { color: var(--accent-hover); text-decoration: underline; }
::selection { background: var(--indigo); color: var(--paper); }
:focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px; }
img { max-width: 100%; display: block; }
@media (prefers-reduced-motion: reduce) { * { animation-duration: .001ms !important; transition-duration: .001ms !important; } }

/* ---- 4. Brand utilities ------------------------------------------------- */
.on-dark { color: var(--text-on-dark); }
.eyebrow { display: block; font-weight: 600; font-size: var(--text-eyebrow); text-transform: uppercase;
  letter-spacing: var(--tracking-eyebrow); color: var(--text-accent); margin: 0 0 var(--space-4); }
.on-dark .eyebrow, .eyebrow--warm { color: var(--orange); }
.display { font-weight: 800; font-size: var(--text-display); line-height: var(--leading-tight);
  letter-spacing: var(--tracking-display); text-transform: uppercase; margin: 0; }
.display--xl { font-size: var(--text-display-xl); }
.gt { background: var(--gradient-text); -webkit-background-clip: text; background-clip: text; color: transparent; }
.lead { font-size: var(--text-body-lg); line-height: 1.5; color: var(--text-primary); max-width: 62ch; }
.muted { color: var(--text-secondary); }
.sphere { border-radius: 50%; background: var(--gradient-mesh); aspect-ratio: 1; }
.sphere--blur { filter: blur(32px); opacity: .9; }
.slash { position: absolute; height: 2px; background: linear-gradient(90deg, transparent, var(--coral), transparent);
  transform: rotate(-19deg); pointer-events: none; }

.bg-ink { background: var(--ink); color: var(--paper); }
.bg-paper { background: var(--paper); }
.icon { width: 1.5em; height: 1.5em; display: inline-block; vertical-align: middle; color: var(--indigo); }

/* ---- 5. Web components -------------------------------------------------- */
.container { width: min(var(--container), 100% - 2 * var(--page-margin)); margin-inline: auto; }
.section { padding-block: clamp(56px, 9vw, 120px); position: relative; overflow: hidden; }
.grid { display: grid; gap: var(--space-6); grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); min-height: 48px;
  padding: 12px 28px; border-radius: var(--radius-pill); border: 2px solid transparent; font: 600 16px/1 var(--font-sans);
  cursor: pointer; text-decoration: none !important; transition: filter var(--dur-fast) var(--ease-standard), transform var(--dur-fast) var(--ease-standard), background var(--dur-fast); }
.btn:hover { filter: brightness(1.08); } .btn:active { transform: scale(.96); }
.btn--primary { background: var(--indigo); color: var(--paper); }
.btn--gradient { background: var(--gradient-coral-indigo); color: var(--paper); box-shadow: var(--shadow-indigo); }
.btn--secondary { background: transparent; color: var(--ink); border-color: var(--ink); }
.btn--ghost { background: transparent; color: var(--indigo); }
.btn--inverse { background: var(--paper); color: var(--ink); }
.on-dark .btn--secondary { color: var(--paper); border-color: var(--paper); }

.card { background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm); padding: var(--space-8); transition: transform var(--dur-med) var(--ease-out), box-shadow var(--dur-med); }
a.card:hover, .card--interactive:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); text-decoration: none; }
.card--rule { border-top: 0; position: relative; overflow: hidden; }
.card--rule::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--gradient-coral-indigo); }
.card--indigo { background: var(--indigo); color: var(--paper); border-color: transparent; }
.card--gradient { background: var(--gradient-mesh); color: var(--paper); border-color: transparent; }
.card--dark { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.14); color: var(--paper); backdrop-filter: blur(12px); }
/* Gradient/image fills must start at the border edge. .btn/.card carry a transparent
   border, and the `background` shorthand resets origin to padding-box, so without this the
   gradient tiles into the border and leaves a slice of the opposite end on each edge. */
.btn, .card, .badge, .tag, .stat-sphere { background-origin: border-box; }

.badge { display: inline-flex; align-items: center; padding: 4px 12px; border-radius: var(--radius-pill);
  font: 600 13px/1.4 var(--font-sans); background: var(--indigo-100); color: var(--indigo-700); }
.badge--solid { background: var(--indigo); color: var(--paper); } .badge--coral { background: var(--coral-100); color: #A3260D; }
.tag { display: inline-flex; padding: 6px 14px; border-radius: var(--radius-pill); border: 1px solid var(--border-default);
  font: 500 14px/1.3 var(--font-sans); color: var(--ink); background: transparent; cursor: pointer; }
.tag[aria-pressed="true"], .tag.is-active { background: var(--indigo); border-color: var(--indigo); color: var(--paper); }

.tabs { display: flex; gap: var(--space-2); border-bottom: 1px solid var(--border-subtle); overflow-x: auto; }
.tabs [role="tab"] { appearance: none; background: none; border: 0; padding: 14px 18px; font: 600 15px/1 var(--font-sans);
  color: var(--text-secondary); border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
.tabs [role="tab"][aria-selected="true"] { color: var(--indigo); border-bottom-color: var(--indigo); }
[role="tabpanel"][hidden] { display: none; }

.stat { display: flex; flex-direction: column; gap: 6px; }
.stat__value { font-weight: 800; font-size: clamp(40px, 5vw, 64px); line-height: 1; letter-spacing: -0.02em; color: var(--indigo); }
.stat:nth-child(3n+2) .stat__value { color: var(--coral); } .stat:nth-child(3n+3) .stat__value { color: var(--orange); }
.on-dark .stat__value { color: var(--paper); }
.stat__label { font-weight: 600; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-secondary); }
.on-dark .stat__label { color: rgba(248,248,248,.85); }
.stat-sphere { width: 180px; aspect-ratio: 1; border-radius: 50%; background: var(--gradient-mesh); color: var(--paper);
  display: grid; place-items: center; text-align: center; font-weight: 800; font-size: 44px; box-shadow: var(--shadow-indigo); }
.stat-sphere small { display: block; font-weight: 600; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }

.field { display: grid; gap: 6px; } .field label { font: 600 14px/1.3 var(--font-sans); }
.input, .select { min-height: 48px; padding: 12px 16px; border-radius: var(--radius-sm); border: 1px solid var(--border-default);
  font: 400 16px/1.3 var(--font-sans); color: var(--ink); background: var(--true-white); width: 100%; }
.input:focus, .select:focus { outline: none; border: 2px solid var(--indigo); box-shadow: 0 0 0 4px rgba(88,1,247,.14); }

details.accordion { border-bottom: 1px solid var(--border-subtle); padding-block: var(--space-4); }
details.accordion summary { cursor: pointer; font-weight: 700; font-size: 19px; list-style: none; display: flex; justify-content: space-between; gap: 16px; }
details.accordion summary::after { content: "+"; color: var(--indigo); font-weight: 600; font-size: 24px; line-height: 1; }
details.accordion[open] summary::after { content: "\2212"; }

.nav { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between; gap: 24px;
  padding: 14px var(--page-margin); background: rgba(248,248,248,.82); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border-subtle); }
.nav--dark { background: rgba(21,19,28,.92); border-color: rgba(255,255,255,.1); color: var(--paper); }
.nav img { height: 26px; width: auto; }
.footer { background: var(--ink); color: var(--paper); padding: 48px var(--page-margin); font-size: 14px; }
.footer .copyright { color: rgba(248,248,248,.75); }

.js-reveal .reveal { opacity: 0; transform: translateY(16px); transition: opacity var(--dur-slow) var(--ease-out), transform var(--dur-slow) var(--ease-out); }
.js-reveal .reveal.is-in { opacity: 1; transform: none; }

/* ---- 6. Data viz (shared web + print) ---------------------------------- */
.bars { display: grid; gap: 14px; }
.bar { display: grid; grid-template-columns: minmax(120px, 34%) 1fr auto; align-items: center; gap: 16px; }
.bar__label { font-weight: 500; } .bar__value { font-weight: 800; min-width: 3.2em; text-align: right; }
.bar__track { height: 14px; border-radius: 99px; background: var(--gray-200); position: relative; overflow: hidden; }
.bar__fill { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: var(--indigo); }
.bar__fill--2 { background: var(--indigo-300); }
.bar--highlight .bar__label { font-weight: 700; }
.legend { display: flex; gap: 20px; font-size: .85em; color: var(--text-secondary); margin-top: 12px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
.rings { display: grid; gap: 20px; }
.ring-stat { display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center; }
.ring { width: 84px; aspect-ratio: 1; border-radius: 50%; background: conic-gradient(var(--ring-colour, var(--indigo)) calc(var(--p) * 1%), var(--gray-200) 0);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 11px), #000 calc(100% - 10px)); mask: radial-gradient(farthest-side, transparent calc(100% - 11px), #000 calc(100% - 10px)); }
.ring-stat__value { font-weight: 800; font-size: 34px; line-height: 1; color: var(--indigo); }
.segbar { display: flex; gap: 6px; } .segbar > div { padding: 10px 12px; border-radius: 8px; color: var(--paper); font-weight: 700; font-size: .85em; line-height: 1.15; }

/* ==========================================================================
   7. PRINT DOCUMENT (build_doc.py → PDF). Units in pt.
   ========================================================================== */
.doc { --doc-body: 11pt; font-size: var(--doc-body); line-height: 1.5; color: var(--ink); background: #fff; }
/* Page chrome lives in @page margin boxes (text + counter only; Chromium does
   not paint images there). build_doc.py writes the strings per document and
   stamps the Incubeta symbol top-left on every non-full-bleed page. */
@page { margin: 24mm 20mm 22mm 20mm; }

.doc-cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(12,10,20,.5), rgba(12,10,20,.15) 45%, rgba(12,10,20,.7)); z-index: 0; }
.doc-cover > * { position: relative; z-index: 1; }
.doc-cover .head { display: flex; justify-content: space-between; align-items: center; }
.doc-cover .head img { height: 22pt; width: auto; }
.doc-cover .edition { font-weight: 600; font-size: 9pt; letter-spacing: .18em; text-transform: uppercase; }
.doc-cover .mid { margin-top: auto; }
.doc-cover .kicker { font-weight: 600; font-size: 11pt; letter-spacing: .2em; text-transform: uppercase; color: var(--orange); margin: 0 0 16pt; }
.doc-cover h1 { font-weight: 800; font-size: 50pt; line-height: .95; letter-spacing: -0.01em; text-transform: uppercase; margin: 0; color: var(--paper); }
.doc-cover .desc { font-size: 14pt; line-height: 1.45; max-width: 30em; margin: 22pt 0 0; }
.doc-cover .meta { margin-top: auto; padding-top: 18pt; border-top: 1px solid rgba(255,255,255,.3); font-weight: 600; font-size: 9pt; letter-spacing: .14em; text-transform: uppercase; display: flex; justify-content: space-between; gap: 12pt; }
.doc-cover.cover--light { background: var(--paper); color: var(--ink); }
.doc-cover.cover--light::after { display: none; }
.doc-cover.cover--light h1 { color: var(--ink); }
.doc-cover.cover--light .kicker { color: var(--indigo); }
.doc-cover.cover--light .meta { border-color: var(--gray-300); }

.doc .b-body { margin: 0 0 9pt; }
.doc .b-label { font-weight: 700; font-size: 9pt; letter-spacing: .12em; text-transform: uppercase; color: var(--gray-700); margin: 10pt 0 3pt; break-after: avoid; }
.doc ul.b-list, .doc ol.b-list { margin: 0 0 10pt; padding-left: 16pt; }
.doc .b-list li { margin: 0 0 5pt; padding-left: 3pt; }
.doc ul.b-list li::marker { color: var(--indigo); font-size: 1.1em; }
.doc ol.b-list li::marker { color: var(--indigo); font-weight: 700; }
.doc .b-callout { background: var(--indigo-100); border-radius: 12pt; padding: 12pt 16pt; margin: 12pt 0; break-inside: avoid; }
.doc .b-callout .t { font-weight: 700; font-size: 8.5pt; letter-spacing: .14em; text-transform: uppercase; color: var(--indigo); margin-bottom: 4pt; }
.doc .b-callout p { margin: 0; }
.doc .b-callout.coral { background: var(--coral-100); } .doc .b-callout.coral .t { color: #B42D12; }
.doc .b-callout.dark { background: var(--ink); color: var(--paper); } .doc .b-callout.dark .t { color: var(--orange); }
.doc .b-quote { position: relative; padding: 2pt 0 2pt 16pt; margin: 16pt 0; break-inside: avoid; }
.doc .b-quote::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3pt; border-radius: 3pt; background: linear-gradient(180deg, var(--coral), var(--indigo)); }
.doc .b-quote p { font-weight: 600; font-size: 15pt; line-height: 1.35; margin: 0 0 6pt; }
.doc .b-quote cite { font-style: normal; font-size: 9.5pt; color: var(--gray-700); }
.doc .b-stats { display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); gap: 16pt; margin: 14pt 0; break-inside: avoid; }
.doc .b-stats .v { font-weight: 800; font-size: 30pt; line-height: 1; letter-spacing: -0.02em; color: var(--indigo); }
.doc .b-stats > div:nth-child(3n+2) .v { color: var(--coral); } .doc .b-stats > div:nth-child(3n+3) .v { color: var(--orange); }
.doc .b-stats .l { font-weight: 700; font-size: 8.5pt; letter-spacing: .12em; text-transform: uppercase; margin-top: 6pt; }
.doc .b-stats .d { font-size: 9.5pt; line-height: 1.4; margin-top: 4pt; color: var(--gray-700); }
.doc .b-stats.band { background: var(--ink); color: var(--paper); padding: 16pt 18pt; border-radius: 14pt; }
.doc .b-stats.band .v { color: var(--paper); } .doc .b-stats.band .d { color: rgba(248,248,248,.85); }
.doc table.b-table { width: 100%; border-collapse: collapse; font-size: 10pt; margin: 10pt 0 12pt; break-inside: auto; }
.doc .b-table th { background: var(--ink); color: var(--paper); font-weight: 700; font-size: 8.5pt; letter-spacing: .1em; text-transform: uppercase; text-align: left; padding: 7pt 9pt; }
.doc .b-table th:first-child { border-top-left-radius: 8pt; } .doc .b-table th:last-child { border-top-right-radius: 8pt; }
.doc .b-table td { padding: 7pt 9pt; border-bottom: 1px solid var(--gray-200); vertical-align: top; }
.doc .b-table tr:nth-child(even) td { background: var(--gray-100); }
.doc .b-table tr { break-inside: avoid; }
.doc .b-cards { display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); gap: 12pt; margin: 12pt 0; }
.doc .b-cards .c { background: var(--true-white); border: 1px solid var(--gray-200); border-radius: 12pt; padding: 14pt; position: relative; overflow: hidden; break-inside: avoid; }
.doc .b-cards .c::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3pt; background: var(--gradient-coral-indigo); }
.doc .b-cards .k { font-weight: 700; font-size: 8pt; letter-spacing: .14em; text-transform: uppercase; color: var(--indigo); }
.doc .b-cards .v { font-weight: 800; font-size: 24pt; line-height: 1.05; margin: 6pt 0 4pt; color: var(--indigo); }
.doc .b-cards h4 { font-size: 12pt; margin: 6pt 0 4pt; }
.doc .b-cards p { font-size: 10pt; line-height: 1.45; margin: 0; }
.doc .b-steps { display: grid; grid-template-columns: repeat(var(--n, 4), 1fr); gap: 14pt; margin: 12pt 0; break-inside: avoid; }
.doc .b-steps .n { font-weight: 800; font-size: 16pt; color: var(--orange); }
.doc .b-steps h4 { font-size: 11pt; text-transform: uppercase; letter-spacing: .06em; margin: 4pt 0; }
.doc .b-steps p { font-size: 10pt; line-height: 1.45; margin: 0; }
.doc .b-steps .w { font-size: 8.5pt; font-weight: 600; color: var(--gray-700); margin-top: 4pt; }
.doc .b-pillars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16pt; margin: 12pt 0; break-inside: avoid; }
.doc .b-pillars > div { border-top: 3pt solid var(--indigo); padding-top: 10pt; }
.doc .b-pillars > div:nth-child(2) { border-color: var(--coral); } .doc .b-pillars > div:nth-child(3) { border-color: var(--violet); }
.doc .b-pillars .k { font-weight: 700; font-size: 8pt; letter-spacing: .14em; text-transform: uppercase; color: var(--gray-700); }
.doc .b-pillars h4 { font-size: 13pt; text-transform: uppercase; margin: 4pt 0 6pt; line-height: 1.1; }
.doc .b-pillars p { font-size: 10pt; line-height: 1.45; margin: 0; }
.doc figure.b-image { margin: 12pt 0; break-inside: avoid; } .doc .b-image img { border-radius: 12pt; width: 100%; }
.doc .b-caption, .doc figcaption { font-size: 9pt; color: var(--gray-700); margin-top: 5pt; }
.doc .b-source { font-size: 8.5pt; color: var(--gray-700); margin: 4pt 0 10pt; }
.doc .b-chart { margin: 12pt 0; break-inside: avoid; }
.doc .b-chart .bar { grid-template-columns: 34% 1fr 3.5em; gap: 10pt; font-size: 10pt; }
.doc .b-chart .bar__track { height: 10pt; }
.doc .b-chart .ttl { font-weight: 700; font-size: 11pt; margin-bottom: 8pt; }
.doc .b-rule { height: 3pt; width: 36pt; border-radius: 3pt; background: var(--gradient-coral-indigo); margin: 20pt 0 4pt; break-after: avoid; }
.doc .pb { break-after: page; }
.doc .flow > :first-child { margin-top: 0; }
</style>
<style>
  body { margin: 0; }
  .gate { position: relative; overflow: hidden; min-height: 100vh; display: grid; place-items: center; padding: var(--space-6) var(--space-4) var(--space-16); }
  .gate .orb { position: absolute; right: -20vw; top: 50%; translate: 0 -50%; width: min(70vw, 800px); opacity: .9; pointer-events: none; }
  .gate form { position: relative; z-index: 2; width: 100%; max-width: 520px; }
  .gate .logo { height: 28px; width: auto; margin-bottom: var(--space-10); }
  .gate h1 { color: var(--paper); margin-bottom: var(--space-3); }
  .gate p { color: rgba(248,248,248,.85); }
  .gate .row { display: flex; flex-wrap: wrap; gap: var(--space-3); margin-top: var(--space-6); }
  .gate .row .input { flex: 1 1 240px; border-radius: var(--radius-pill); padding-inline: var(--space-5); }
  .gate .err { color: var(--orange); font-weight: 600; min-height: 24px; margin: var(--space-3) 0 0; }
  .gate .help a { color: var(--orange); }
  .gate .copyright { position: absolute; left: var(--space-4); right: var(--space-4); bottom: var(--space-4); z-index: 2; text-align: center; font-size: 13px; color: rgba(248,248,248,.75); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .shake { animation: shake .3s var(--ease-standard); }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @media (max-width: 760px) { .gate .orb { opacity: .45; right: -50vw; width: 130vw; } }
</style>
</head>
