<style>
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
.gate{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#16141C;color:#F8F8F8;font-family:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:hidden}
.gate::before{content:"";position:absolute;right:-20vw;top:50%;width:min(80vw,860px);aspect-ratio:1;translate:0 -50%;border-radius:50%;background:radial-gradient(circle at 35% 35%,#7B3BFF 0%,#5801F7 35%,rgba(88,1,247,0) 70%);opacity:.55;pointer-events:none}
.gate form{position:relative;width:100%;max-width:520px;display:flex;flex-direction:column;gap:14px}
.gate .eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(248,248,248,.7);margin:0}
.gate h1{font-size:clamp(28px,5vw,40px);font-weight:800;line-height:1.12;letter-spacing:-.02em;margin:0}
.gate p{margin:0;color:rgba(248,248,248,.82);line-height:1.6}
.gate .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.gate input{flex:1 1 220px;min-width:0;font:inherit;font-size:16px;padding:12px 18px;border-radius:999px;border:1px solid rgba(248,248,248,.35);background:rgba(255,255,255,.08);color:#F8F8F8}
.gate input::placeholder{color:rgba(248,248,248,.55)}
.gate button{font:inherit;font-size:15px;font-weight:700;padding:12px 22px;border-radius:999px;border:0;background:#F8F8F8;color:#212121;cursor:pointer}
.gate button[disabled]{opacity:.6;cursor:progress}
.gate input:focus-visible,.gate button:focus-visible{outline:2px solid #B794FF;outline-offset:2px}
.gate .err{min-height:22px;font-size:14px;font-weight:600;color:#FFB4A2}
.gate .glogos{display:flex;align-items:center;gap:16px;margin-bottom:22px}.gate .glogos img{height:20px;width:auto}.gate .glogos svg{height:22px;width:auto}.gate .glogos .x{width:1px;height:24px;background:rgba(248,248,248,.3)}.gate .brand{font-size:13px;font-weight:700;letter-spacing:.02em;color:rgba(248,248,248,.85);margin-top:18px}
@media (prefers-reduced-motion:no-preference){.shake{animation:shake .3s ease-out}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}}
</style>

const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:d(P.salt),iterations:P.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:d(P.iv)},key,d(P.ct));
  return JSON.parse(new TextDecoder().decode(buf));
}
const f=document.getElementById("gateForm"),pw=document.getElementById("pw"),err=document.getElementById("err"),go=document.getElementById("go");
pw.focus();
f.addEventListener("submit",async e=>{
  e.preventDefault();err.textContent="";go.disabled=true;go.textContent="Opening...";
  try{
    if(!window.crypto||!crypto.subtle) throw new Error("nocrypto");
    const page=await open(pw.value);
    document.getElementById("app").innerHTML=page.markup;
    document.getElementById("gate").remove();
    const s=document.createElement("script");s.textContent=page.script;document.body.appendChild(s);
    window.scrollTo(0,0);
  }catch(x){
    go.disabled=false;go.textContent="View page";
    err.textContent=x&&x.message==="nocrypto"?"This browser can't open the page. Try a current version of Chrome, Edge, Safari or Firefox.":"That password didn't work. Check it and try again.";
    f.classList.remove("shake");void f.offsetWidth;f.classList.add("shake");pw.select();
  }
});
