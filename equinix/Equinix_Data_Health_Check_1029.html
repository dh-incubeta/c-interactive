body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--fg); font-family: Montserrat, system-ui, sans-serif; }

h1 { margin: 0; font-size: 22px; font-weight: 800; }
p { margin: 0; font-size: 15px; color: var(--fg2); line-height: 1.5; }
label { font-size: 14px; font-weight: 600; }
input { width: 100%; font: inherit; font-size: 16px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--fg); }
button { font: inherit; font-weight: 600; font-size: 16px; padding: 12px; border: 0; border-radius: 10px; background: var(--accent); color: #ffffff; cursor: pointer; }
button:disabled { opacity: 0.6; cursor: wait; }
.err { color: var(--bad); font-size: 14px; min-height: 20px; }
.fine { font-size: 13px; }
</style>
